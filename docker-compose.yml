services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pricing_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pricing_trading"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - pricing_trading_postgres_data:/var/lib/postgresql/data

volumes:
  pricing_trading_postgres_data:
